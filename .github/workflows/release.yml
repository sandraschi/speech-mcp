name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.3)"
        required: true
        default: "v0.6.3"

permissions:
  contents: write

jobs:
  wheel-and-mcpb:
    name: Wheel + MCPB (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Build wheel and sdist
        run: uv build

      - name: Build MCPB package
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          npm install -g @anthropic-ai/mcpb
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          mcpb pack . "dist/speech-mcp-$tag.mcpb"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: .github/RELEASE_${{ github.event.inputs.tag || github.ref_name }}.md
          draft: false
          prerelease: true
          fail_on_unmatched_files: false

# Tauri NSIS/MSI (~180 MB): build locally — just publish-release-local
