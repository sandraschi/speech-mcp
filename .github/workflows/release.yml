name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.3)"
        required: true
        default: "v0.6.3"

permissions:
  contents: write

jobs:
  wheel-and-mcpb:
    name: Python wheel + MCPB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Build wheel and sdist
        run: uv build

      - name: Build MCPB package
        run: |
          npm install -g @anthropic-ai/mcpb
          mkdir -p dist
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mcpb pack . "dist/speech-mcp-${TAG}.mcpb"

      - uses: actions/upload-artifact@v4
        with:
          name: python-mcpb
          path: dist/*

  windows-tauri:
    name: Windows Tauri installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync Python deps
        run: uv sync

      - name: Build Tauri (web + sidecar + NSIS/MSI)
        run: pwsh -NoLogo -File native/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            native/target/release/bundle/nsis/*.exe
            native/target/release/bundle/msi/*.msi

  publish:
    name: GitHub Release
    needs: [wheel-and-mcpb, windows-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p dist
          cp artifacts/python-mcpb/* dist/ 2>/dev/null || true
          cp artifacts/windows-installer/* dist/ 2>/dev/null || true
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: .github/RELEASE_${{ github.event.inputs.tag || github.ref_name }}.md
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
