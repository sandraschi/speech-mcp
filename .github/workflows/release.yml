name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.3)"
        required: true
        default: "v0.6.3"

permissions:
  contents: write

jobs:
  wheel-and-mcpb:
    name: Python wheel + MCPB (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Build wheel and sdist
        run: uv build

      - name: Build MCPB package
        run: |
          npm install -g @anthropic-ai/mcpb
          mkdir -p dist
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mcpb pack . "dist/speech-mcp-${TAG}.mcpb"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: .github/RELEASE_${{ github.event.inputs.tag || github.ref_name }}.md
          draft: false
          prerelease: true
          fail_on_unmatched_files: false

# Windows Tauri installers (~180 MB) are built locally — GitHub Actions runners not used.
# On Windows: pwsh scripts/publish-release-local.ps1 -Tag v0.6.3
