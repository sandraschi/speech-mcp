[project]
name = "speech-mcp"
version = "0.2.1"
description = "SOTA MCP server for Hume AI EVI and Octave"
dependencies = [
    "fastmcp>=2.14.5",
    "hume>=0.7.0",
    "elevenlabs>=1.0.0",
    "websockets",
    "python-dotenv",
    "pydantic>=2.0.0",
    "fastapi",
    "uvicorn",
    "pyttsx3"
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
